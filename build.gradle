plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    // Create, Ponder, Flywheel
    maven { url = 'https://maven.createmod.net' }
    // Registrate (Create's registration library)
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    // JEI, Vazkii's mods — handy once you add optional integrations
    maven { url = 'https://maven.blamejared.com' }
    // Sable and Create: Aeronautics, for dev runs
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    // Create ships an access transformer; addons that touch its internals need it applied.
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', ''
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

sourceSets.main.resources.srcDir 'src/generated/resources'

configurations {
    // Mods present in runClient and runServer but not in the published metadata.
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create for NeoForge. Pulls in Registrate, Ponder, Catnip and Flywheel transitively.
    implementation "com.simibubi.create:create-${minecraft_version}:${create_version}"
    // Declared explicitly so the version is visible and pinnable.
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    // Sable's sub-level API. Compile-time only: this mod does not ship or require it.
    compileOnly "maven.modrinth:sable:${sable_version}"

    // Loaded into runClient and runServer so sub-level vehicles can be tested against the mechanic.
    // Aeronautics bundles Simulated and Offroad through jar-in-jar, so it pulls in its own stack.
    if (aeronautics_enable.toBoolean()) {
        localRuntime "maven.modrinth:sable:${sable_version}"
        localRuntime "maven.modrinth:create-aeronautics:${aeronautics_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Expand the gradle.properties values used in neoforge.mods.toml and pack.mcmeta.
tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            create_version         : create_version,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties expandProps
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Vendor' : mod_authors,
            'Implementation-Version': mod_version
    ])
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}
